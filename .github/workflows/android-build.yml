name: Build Keja Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with a system Gradle install — use it once to
      # bootstrap the wrapper instead of committing a binary
      # gradle-wrapper.jar to the repo.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Register Kotlin compiler problem matcher
        run: echo "::add-matcher::.github/kotlinc-matcher.json"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true

      # The annotations above depend on matching the compiler's exact output
      # format, which varies by Kotlin version and can silently match
      # nothing. This is a format-independent fallback: push the real log to
      # a small orphan branch (not main, so it can't trigger this workflow
      # again) so it can be read straight from raw.githubusercontent.com —
      # no GitHub-authenticated log download needed.
      - name: Publish build log for debugging (on failure)
        if: steps.build.outcome == 'failure'
        working-directory: /tmp
        run: |
          set -e
          tail -n 500 "$GITHUB_WORKSPACE/android/build.log" > last-build.log
          rm -rf logrepo
          git init -q logrepo
          cd logrepo
          git checkout -q -b ci-logs
          cp ../last-build.log .
          git config user.email "ci@keja.local"
          git config user.name "Keja CI"
          git add last-build.log
          git commit -q -m "Build log for ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q origin ci-logs --force

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: keja-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts require a GitHub login to download, which is no
      # good for a public "Download" button on the website. A GitHub
      # Release asset is a plain public URL with no login wall, and this
      # re-publishes to the SAME tag every build so the website's link
      # never has to change.
      - name: Publish APK as a public release asset
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Keja Android (latest build)"
          body: "Automatically rebuilt from the latest commit to main. Debug build — not signed for the Play Store."
          make_latest: true
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

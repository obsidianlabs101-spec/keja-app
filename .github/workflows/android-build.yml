name: Build Keja Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with a system Gradle install — use it once to
      # bootstrap the wrapper instead of committing a binary
      # gradle-wrapper.jar to the repo.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Register Kotlin compiler problem matcher
        run: echo "::add-matcher::.github/kotlinc-matcher.json"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keja-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts require a GitHub login to download, which is no
      # good for a public "Download" button on the website. A GitHub
      # Release asset is a plain public URL with no login wall, and this
      # re-publishes to the SAME tag every build so the website's link
      # never has to change.
      - name: Publish APK as a public release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Keja Android (latest build)"
          body: "Automatically rebuilt from the latest commit to main. Debug build — not signed for the Play Store."
          make_latest: true
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

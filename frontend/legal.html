<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal — BASH</title>
<style>
  :root {
    --text-main: #f1f5f9;
    --text-soft: #cbd5e1;
    --text-muted: #64748b;
    --accent: #a855f7;
    --accent2: #ff758c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1030 0%, #05070d 60%);
    color: var(--text-soft);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 20px 80px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent2); text-decoration: none; font-weight: 700;
    font-size: 0.9rem; margin-bottom: 24px;
  }
  h1 {
    font-size: 1.6rem; margin: 0 0 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { color: var(--text-muted); font-size: 0.88rem; margin: 0 0 28px; }
  .legal-list { display: flex; flex-direction: column; gap: 12px; }
  .legal-item {
    display: block; padding: 16px 18px; border-radius: 14px;
    background: rgba(20,29,51,0.6); border: 1px solid rgba(255,255,255,0.06);
    text-decoration: none; color: var(--text-main); font-weight: 700;
    font-size: 0.95rem; transition: border-color 0.15s;
  }
  .legal-item:hover { border-color: var(--accent2); }
  .legal-item span { display: block; color: var(--text-muted); font-weight: 400; font-size: 0.8rem; margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="profile.html">&larr; Back to Profile</a>
  <h1>Legal</h1>
  <p class="sub">Everything covering your use of BASH.</p>
  <div class="legal-list">
    <a class="legal-item" href="terms.html">Terms & Conditions<span>The agreement between you and BASH</span></a>
    <a class="legal-item" href="privacy.html">Privacy Policy<span>What we collect and how it's used</span></a>
    <a class="legal-item" href="cookies.html">Cookie Policy<span>How we use cookies on the Platform</span></a>
    <a class="legal-item" href="terms.html">Landlord Terms<span>Terms specific to landlords listing properties</span></a>
  </div>
</div>
</body>
</html>

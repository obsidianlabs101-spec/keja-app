<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Keja — Landlord dashboard</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="api-config.js"></script>
<link rel="stylesheet" href="keja.css">
<style>
  .back-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .fab { position: fixed; right: 18px; bottom: calc(var(--nav-height) + 16px); width: 54px; height: 54px; border-radius: 50%; background: var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow); border:none; cursor:pointer; z-index: 30; }
  .listing-actions { display:flex; gap: 8px; margin-top: 4px; }
  .listing-actions button { flex: 1; font-size: 12.5px; padding: 8px; }
  .thumb-row { display:flex; gap:8px; flex-wrap:wrap; margin: 8px 0 4px; }
  .thumb-row img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .thumb-row label { width: 64px; height: 64px; border-radius: 10px; border: 1.5px dashed var(--border); display:flex; align-items:center; justify-content:center; color: var(--text-muted); font-size: 22px; cursor:pointer; }
</style>
</head>
<body>
<div class="keja-page">
  <div class="keja-header">
    <a class="back-btn" href="profile.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="keja-brand" style="font-size:18px">My listings</div>
    <div style="width:38px"></div>
  </div>

  <div id="verificationNotice" style="display:none"></div>
  <div id="list"><div class="keja-empty">Loading…</div></div>
</div>

<button class="fab" id="newListingBtn">+</button>
<div id="modalRoot"></div>

<script src="keja-app.js"></script>
<script src="kenya-locations.js"></script>
<script src="landlord.js"></script>
</body>
</html>

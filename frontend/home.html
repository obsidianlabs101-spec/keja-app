<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Keja — Home</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="api-config.js"></script>
<link rel="stylesheet" href="keja.css">
</head>
<body>
<div class="keja-page">
  <div class="keja-header">
    <div>
      <div class="keja-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Keja
      </div>
      <p class="keja-greeting" id="greeting">Good evening 👋</p>
    </div>
    <a class="keja-avatar" href="profile.html" id="avatar">?</a>
  </div>

  <form id="searchForm">
    <div class="keja-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Where do you want to live?">
    </div>
  </form>

  <div class="keja-section">
    <div class="keja-section-title">Recommended for you <a href="discover.html">Discover →</a></div>
    <div class="keja-hscroll" id="recommended"><div class="keja-empty">Loading…</div></div>
  </div>

  <div id="adSlotTop"></div>

  <div class="keja-section">
    <div class="keja-section-title">Near popular locations</div>
    <div class="keja-hscroll" id="nearPopular"><div class="keja-empty">Loading…</div></div>
  </div>

  <div class="keja-section">
    <div class="keja-section-title">Recently added</div>
    <div class="keja-grid" id="recentGrid"><div class="keja-empty">Loading…</div></div>
  </div>
</div>

<script src="keja-app.js"></script>
<script src="home.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keja — Find a place you'll love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">keja<span>.</span></div>
      <div class="top-actions">
        <button class="avatar" data-view="profile">SM</button>
      </div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-view="discover" class="nav-item"><span>⌕</span><small>Discover</small></button>
      <button data-view="interested" class="nav-item"><span>♡</span><small>Interested</small></button>
      <button data-view="profile" class="nav-item"><span>◉</span><small>Profile</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Keja — Find a place you'll love</title>
  <meta name="description" content="Discover rental properties across Kenya, swipe to save, and connect with landlords directly.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6C4DFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keja">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img class="brand-logo brand-logo-light" src="assets/keja-logo.svg" alt="Keja"><img class="brand-logo brand-logo-dark" src="assets/keja-logo-white.svg" alt="" aria-hidden="true"></div>
      <div class="top-actions">
        <button class="icon-btn bell" id="bellBtn" aria-label="Alerts" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="bell-badge" id="bellBadge" hidden>0</span></button>
        <button class="avatar" data-view="profile">SM</button>
      </div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-view="discover" class="nav-item"><span>⌕</span><small>Discover</small></button>
      <button data-view="interested" class="nav-item"><span>♡</span><small>Interested</small></button>
      <button data-view="profile" class="nav-item"><span>◉</span><small>Profile</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

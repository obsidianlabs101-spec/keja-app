<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Keja — Property</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="api-config.js"></script>
<link rel="stylesheet" href="keja.css">
<style>
  body { padding-bottom: 110px; }
  .back-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .p-title { font-size: 20px; font-weight: 800; margin: 14px 0 2px; }
  .p-loc { color: var(--text-secondary); font-size: 14px; }
  .p-price-row { display:flex; align-items:center; justify-content:space-between; margin: 14px 0; }
  .p-price { font-size: 26px; font-weight: 800; }
  .p-desc { font-size: 14.5px; line-height: 1.6; color: var(--text-secondary); margin-top: 6px; }
  .p-save-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .p-save-btn.saved { background: var(--primary); color: #fff; border-color: var(--primary); }
  .sticky-cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom,0)); background: var(--card); border-top: 1px solid var(--border); z-index: 50; }
  .landlord-row { display:flex; align-items:center; gap: 10px; margin-top: 18px; }
  .landlord-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:700; }
</style>
</head>
<body>
<div class="keja-page">
  <div class="keja-header">
    <a class="back-btn" href="javascript:history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="p-save-btn" id="saveBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-7.5-4.6-9.6-9A5.2 5.2 0 0 1 12 6.4 5.2 5.2 0 0 1 21.6 11.5c-2.1 4.4-9.6 9-9.6 9Z" stroke="currentColor" stroke-width="1.8"/></svg>
    </div>
  </div>

  <div id="content"><div class="keja-empty">Loading…</div></div>
</div>

<div class="sticky-cta" id="ctaBar" style="display:none">
  <button class="keja-btn" id="ctaBtn">Get Contact</button>
</div>

<div id="modalRoot"></div>

<script src="keja-app.js"></script>
<script src="property.js"></script>
</body>
</html>
